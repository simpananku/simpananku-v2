# Konfigurasi Nginx untuk SIMPANANKU (Frontend React + Backend Laravel 13 API)
# Dapat digunakan pada VPS Ubuntu / Debian atau container Docker Nginx

server {
    listen 80;
    server_name localhost simpananku.local;

    # Root direktori hasil build frontend Vite (dist)
    root /var/www/frontend/dist;
    index index.html index.php;

    client_max_body_size 64M;
    charset utf-8;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # 1. Routing Frontend React SPA (Vite)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 2. Routing Backend API Laravel 13 (/api/v1/...)
    location /api {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Alternatif jika Laravel berjalan via PHP-FPM langsung pada server yang sama:
    # location ^~ /api {
    #     alias /var/www/backend-laravel/public;
    #     try_files $uri $uri/ @laravel;
    #     location ~ \.php$ {
    #         fastcgi_pass unix:/var/run/php/php8.2-fpm.sock;
    #         fastcgi_param SCRIPT_FILENAME /var/www/backend-laravel/public/index.php;
    #         include fastcgi_params;
    #     }
    # }
    # location @laravel {
    #     rewrite /api/(.*)$ /api/$1 last;
    # }

    # Keamanan file tersembunyi
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
