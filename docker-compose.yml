services:
  database:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${SIMPANANKU_DB_ROOT_PASSWORD:?Set SIMPANANKU_DB_ROOT_PASSWORD in .env}
      MARIADB_DATABASE: simpananku_syariah_db
      MARIADB_USER: simpananku_user
      MARIADB_PASSWORD: ${SIMPANANKU_DB_PASSWORD:?Set SIMPANANKU_DB_PASSWORD in .env}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend-laravel
    restart: unless-stopped
    environment:
      APP_NAME: SIMPANANKU
      APP_ENV: local
      APP_DEBUG: "true"
      APP_KEY: ${SIMPANANKU_APP_KEY:?Set SIMPANANKU_APP_KEY in .env}
      APP_URL: http://127.0.0.1:8000
      DB_CONNECTION: mysql
      DB_HOST: database
      DB_PORT: 3306
      DB_DATABASE: simpananku_syariah_db
      DB_USERNAME: simpananku_user
      DB_PASSWORD: ${SIMPANANKU_DB_PASSWORD}
      SESSION_DRIVER: database
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
      SANCTUM_STATEFUL_DOMAINS: localhost:3000,127.0.0.1:3000
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      database:
        condition: service_healthy

  frontend:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - .:/app
      - frontend_modules:/app/node_modules
    environment:
      VITE_API_URL: /api/v1
      VITE_DEV_API_PROXY_TARGET: http://backend:8000
    command: sh -c "npm install --no-package-lock && npm run dev -- --host 0.0.0.0 --port 3000"
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend

volumes:
  db_data:
  frontend_modules:
