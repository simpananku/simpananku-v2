version: '3.8'

services:
  # Database MariaDB / MySQL 8.0
  database:
    image: mariadb:10.11
    container_name: simpananku_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootsecretpassword
      MYSQL_DATABASE: simpananku_syariah_db
      MYSQL_USER: simpananku_user
      MYSQL_PASSWORD: simpananku_password
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - simpananku_net

  # Backend Laravel 13 API
  backend:
    build:
      context: ./backend-laravel
      dockerfile: Dockerfile
    container_name: simpananku_backend
    restart: unless-stopped
    working_dir: /var/www/html
    environment:
      APP_NAME: SIMPANANKU
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_CONNECTION: mysql
      DB_HOST: database
      DB_PORT: 3306
      DB_DATABASE: simpananku_syariah_db
      DB_USERNAME: simpananku_user
      DB_PASSWORD: simpananku_password
      CORS_ALLOWED_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000,http://localhost:80"
    ports:
      - "8000:8000"
    depends_on:
      - database
    volumes:
      - ./backend-laravel:/var/www/html
    networks:
      - simpananku_net

  # Frontend React (Vite Dev Server)
  frontend:
    image: node:20-alpine
    container_name: simpananku_frontend
    restart: unless-stopped
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:8000/api/v1
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 3000"
    depends_on:
      - backend
    networks:
      - simpananku_net

volumes:
  db_data:
    driver: local

networks:
  simpananku_net:
    driver: bridge
